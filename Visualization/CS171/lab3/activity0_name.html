<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello, my name is...</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1c3fae;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  .name {
    display: flex;
  }
  .letter {
    font-size: 14vw;
    font-weight: 800;
    /* orange gradient, same gradient sampled per-letter so it reads as one band across the word */
    background: linear-gradient(180deg, #ffb347 0%, #eb6834 55%, #b8460e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: bounce 1.1s ease infinite;
  }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.35em); }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter { animation: none; }
  }
</style>
</head>
<body>
  <div class="name" id="name"></div>
  <script>
    // Swap this to your own name - one line to personalize.
    var NAME = "Z";

    var el = document.getElementById('name');
    var letters = NAME.split('');
    letters.forEach(function (ch, i) {
      var span = document.createElement('span');
      span.className = 'letter';
      span.textContent = ch === ' ' ? ' ' : ch;
      // stagger so each letter bounces one after another, not all at once
      span.style.animationDelay = (i * 0.12) + 's';
      el.appendChild(span);
    });
  </script>
</body>
</html>
